name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests (Playwright)
        run: npm run test
        env:
          CI: true
          # Offline-safe defaults; no production secrets in CI.
          NEXT_PUBLIC_ENABLE_MSW: "true"
          NEXT_PUBLIC_MOCK_API: "true"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: http://127.0.0.1:3000

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_MSW: "false"
          NEXT_PUBLIC_MOCK_API: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: http://127.0.0.1:3000

      - name: OpenNext Cloudflare bundle
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_ENABLE_MSW: "false"
          NEXT_PUBLIC_MOCK_API: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: https://girlsglobalinitiative.org
