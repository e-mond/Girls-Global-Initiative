name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests (Playwright)
        run: npm run test
        env:
          CI: true
          # Offline-safe defaults; no production secrets in CI.
          NEXT_PUBLIC_ENABLE_MSW: "true"
          NEXT_PUBLIC_MOCK_API: "true"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: http://127.0.0.1:3000

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_MSW: "false"
          NEXT_PUBLIC_MOCK_API: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: http://127.0.0.1:3000

      - name: OpenNext Cloudflare bundle
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_ENABLE_MSW: "false"
          NEXT_PUBLIC_MOCK_API: "false"
          AUTH_SECRET: ci-test-auth-secret-not-for-production
          AUTH_URL: https://girlsglobalinitiative.org

      - name: Cloudflare Worker runtime smoke
        run: |
          npx --no-install opennextjs-cloudflare preview --port 8787 \
            --var AUTH_SECRET:ci-worker-smoke-secret \
            --var AUTH_URL:http://127.0.0.1:8787 > "$RUNNER_TEMP/ggi-worker.log" 2>&1 &
          ggi_worker_pid=$!
          trap 'ggi_status=$?; kill "$ggi_worker_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/ggi-worker.log"; exit "$ggi_status"' EXIT
          for ggi_attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/health > /dev/null; then
              curl --fail --silent --max-time 10 http://127.0.0.1:8787/ > "$RUNNER_TEMP/ggi-home.html"
              node -e 'require("node:assert/strict").match(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/ggi-home.html", "utf8"), /Photo credits/)'
              test "$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/api/admin/users)" = "401"
              exit 0
            fi
            sleep 1
          done
          exit 1
