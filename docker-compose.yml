services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ggi:ggi@postgres:5432/ggi
      AUTH_SECRET: local-docker-auth-secret-change-me
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_MOCK_API: "false"
      NEXT_PUBLIC_ENABLE_MSW: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ggi
      POSTGRES_PASSWORD: ggi
      POSTGRES_DB: ggi
    ports:
      - "5432:5432"
    volumes:
      - ggi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggi -d ggi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ggi_pg_data:
